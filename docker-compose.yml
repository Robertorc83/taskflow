name: taskmanager

# Local demo stack. It deliberately runs in `development` mode with demo data and a dev JWT secret;
# the image itself defaults to production (fail closed). Never deploy this file as-is.

x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
  DATABASE_URL: postgresql+asyncpg://taskmanager:taskmanager@db:5432/taskmanager
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-in-production!!}
  RATE_LIMIT_AUTH: ${RATE_LIMIT_AUTH:-10/minute}
  RATE_LIMIT_API: ${RATE_LIMIT_API:-100/minute}
  CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173"]'
  LOG_LEVEL: INFO

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taskmanager
      POSTGRES_PASSWORD: taskmanager
      POSTGRES_DB: taskmanager
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Loopback only, on 55432 so it can't clash with a native Postgres (local dev, see README).
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskmanager"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"  # loopback only, for local dev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      <<: *backend-env
      # Only nginx may set X-Forwarded-For; anyone else is keyed by their real address.
      FORWARDED_ALLOW_IPS: 172.28.0.10
    ports:
      - "127.0.0.1:8000:8000"  # Swagger for local use; the app goes through nginx
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: ["celery", "-A", "taskmanager.infrastructure.tasks.worker", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment: *backend-env
    healthcheck:
      # The worker answers a broker round-trip ping (replaces the image's HTTP check).
      test: ["CMD-SHELL", "celery -A taskmanager.infrastructure.tasks.worker inspect ping -d celery@$$HOSTNAME --timeout 5"]
      interval: 15s
      timeout: 10s
      start_period: 20s
      retries: 5
    depends_on:
      api:
        condition: service_healthy  # migrations have run

  web:
    build:
      context: ./frontend
      args:
        VITE_DEMO_MODE: "true"  # show demo credentials on the login page
    environment:
      # The image defaults to TLS and refuses to start without a certificate (CR-012). Local
      # demo runs over plain HTTP; `make up-tls` layers docker-compose.tls.yml on top.
      NGINX_TLS: "false"
    networks:
      default:
        ipv4_address: 172.28.0.10
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  pgdata:
