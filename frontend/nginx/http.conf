# Plain HTTP (NGINX_TLS=false): local compose, or TLS terminated by a load balancer upstream.
server {
    listen 80;
    server_name _;
    server_tokens off;
    set $hsts "";  # never over plain HTTP: browsers ignore it, and it would be a false promise

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    include /etc/nginx/snippets/app.conf;
}
