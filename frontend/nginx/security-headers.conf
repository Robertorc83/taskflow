# Included in every location that sets its own add_header: nginx drops server-level add_header
# directives in any block that declares one, so the headers must be repeated per location.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
# Empty over plain HTTP, so nginx omits it there (http.conf / https.conf set $hsts).
add_header Strict-Transport-Security $hsts always;
